[package]
name = "priv2-worker"
version = "0.1.0"
edition = "2021"
publish = false

# PRIV2: the OutLayer worker's template builder. Its own workspace, not a member of the
# root one: it targets wasm32-wasip2 inside OutLayer's TEE and never links near-sdk. Run
# its tests with
#   cargo test --manifest-path contract/priv2-worker/Cargo.toml
# The OutLayer entry point (stdin/stdout, signing_keys, manifest) is not here yet.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
