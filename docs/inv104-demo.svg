opacity:0}70.03%,96%{opacity:1}100%{opacity:0}}.l18{animation-name:k18}@media (prefers-reduced-motion:reduce){.l{animation:none;opacity:1}}</style>
<rect width="900" height="510" rx="10" fill="#0d1117" stroke="#30363d"/>
<circle cx="24" cy="22" r="6" fill="#ff5f56"/><circle cx="44" cy="22" r="6" fill="#ffbd2e"/><circle cx="64" cy="22" r="6" fill="#27c93f"/>
<text class="t" x="450" y="26" text-anchor="middle">pnpm demo:inv104 · replay of demo/evidence/ap1-inv104-local-sandbox.txt (abridged)</text>
<line x1="0" y1="42" x2="900" y2="42" stroke="#30363d"/>
<text class="l l0 cmd" x="24" y="74" xml:space="preserve">$ pnpm demo:inv104</text>
<text class="l l1 dim" x="24" y="96" xml:space="preserve">AP1 INV-104 demo: LOCAL SANDBOX RUN (near-workspaces), NOT TESTNET</text>
<text class="l l2 dim" x="24" y="118" xml:space="preserve">contract mandate.test.near | agent agent-1 | MPC: mock signer</text>
<text class="l l4 step" x="24" y="162" xml:space="preserve">[2] Owner registers supplier acme (Acme GmbH, cap 50 EUR) at IBAN A ****3000</text>
<text class="l l5 ok" x="24" y="184" xml:space="preserve">  outcome: OK</text>
<text class="l l6 step" x="24" y="206" xml:space="preserve">[3] Agent pays INV-104, EUR 42.50, to IBAN A</text>
<text class="l l7 ev" x="24" y="228" xml:space="preserve">  event payout_approved</text>
<text class="l l8 ok" x="24" y="250" xml:space="preserve">  outcome: OK    reservation: Signed (payout order signed by the MPC)</text>
<text class="l l9 step" x="24" y="272" xml:space="preserve">[4] &quot;We changed banks&quot; email: owner moves acme to IBAN B ****5555</text>
<text class="l l10 ev" x="24" y="294" xml:space="preserve">  event supplier_iban_pending</text>
<text class="l l11 step" x="24" y="316" xml:space="preserve">[5] Agent pays INV-105, EUR 10, to IBAN B during the cooling-off</text>
<text class="l l12 ev" x="24" y="338" xml:space="preserve">  event payout_refused  reason=ERR_BANK_CHANGE_COOLING_OFF</text>
<text class="l l13 no" x="24" y="360" xml:space="preserve">  outcome: REFUSED ERR_BANK_CHANGE_COOLING_OFF</text>
<text class="l l14 step" x="24" y="382" xml:space="preserve">[6] Agent pays INV-104 again, EUR 42.50, to IBAN A</text>
<text class="l l15 ev" x="24" y="404" xml:space="preserve">  event payout_refused  reason=ERR_DUPLICATE_INVOICE</text>
<text class="l l16 no" x="24" y="426" xml:space="preserve">  outcome: REFUSED ERR_DUPLICATE_INVOICE</text>
<text class="l l18 res" x="24" y="470" xml:space="preserve">Result: INV-104 paid once; the new IBAN held during the cooling-off; INV-104 again refused.</text>
</svg>
