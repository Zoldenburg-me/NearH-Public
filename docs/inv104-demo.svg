<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" width="900" role="img" aria-labelledby="t d">
<title id="t">pnpm demo:inv104, replayed from the recorded local sandbox transcript</title>
<desc id="d">Invoice INV-104 is paid to IBAN A. After a "we changed banks" email the supplier is moved to IBAN B; a payout to IBAN B during the cooling-off is refused with ERR_BANK_CHANGE_COOLING_OFF, and INV-104 sent again is refused with ERR_DUPLICATE_INVOICE.</desc>
